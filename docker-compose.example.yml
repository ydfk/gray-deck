services:
  graydeck:
    image: ${GRAYDECK_IMAGE:-ghcr.io/ydfk/graydeck:latest}
    container_name: graydeck
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
      - "7890:17890/tcp"
      - "7890:17890/udp"
      - "7891:17891/tcp"
      - "7892:17892/tcp"
      - "7893:17893/tcp"
      - "7893:17893/udp"
    environment:
      GRAYDECK_SECRET: "change-this-secret"
    volumes:
      # graydeck.sqlite 和已下载的核心、面板资源存放在这里。
      - ./data:/data
      - ./config:/config
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
