# Graydeck 服务配置
server:
  port: 8080
auth:
  enabled: true
  username: admin
  password: admin123
update:
  # 核心和面板资源优先使用镜像。Graydeck 版本检查优先使用 GitHub 官方接口。
  prefer-proxy: true
  proxy-url: https://ghfast.top/
zashboard:
  hide-settings: true
traffic:
  # 填写格式为「日 HH:MM」，省略结束时间则在下一周期开始时结束。
  # start: "1 00:00"
  # end: "1 00:00"
  retention-months: 12
  # 流量汇总和连接明细共用数据目录下的 graydeck.sqlite。
  max-size-mib: 100
  # 设置为 0 可停用连接明细。月度汇总仍会采集。
  # detail-retention-days: 0
