# Graydeck 服务配置
server:
  port: 8080
auth:
  enabled: true
  username: admin
  password: admin123
update:
  prefer-proxy: true
  proxy-url: https://ghfast.top/
zashboard:
  hide-settings: true
traffic:
  # 填写格式为「日 HH:MM」，省略结束时间则在下一周期开始时结束。
  # start: "1 00:00"
  # end: "1 00:00"
  retention-months: 12
  max-size-mib: 32
  detail-retention-days: 7
  detail-max-size-mib: 16
